<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>El Gatito Mensajero</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#pad{display:none;position:fixed;inset:0;pointer-events:none}
#dp{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:124px;height:124px;pointer-events:auto;touch-action:none}
.ar,#ab{position:absolute;background:#1b2243;box-shadow:inset 3px 3px 0 #3d4d8a,inset -3px -3px 0 #0a0d1f,0 0 0 3px #05060f;color:#7cffb0;font:bold 16px/40px "Courier New",monospace;text-align:center;font-style:normal;opacity:.82}
.ar{width:40px;height:40px}
#ab{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:60px;height:60px;line-height:60px;font-size:24px;color:#ffb3cf;pointer-events:auto;touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><div id="dp"><i class="ar" style="left:42px;top:0">▲</i><i class="ar" style="left:42px;top:84px">▼</i><i class="ar" style="left:0;top:42px">◀</i><i class="ar" style="left:84px;top:42px">▶</i></div><div id="ab">E</div></div>
<script>
/* ==================== CONFIG (editable) ==================== */
const TO="Yanis", FROM="Kriss", CARD_NAME="Bicha";
const LETTERS=["Hay personas que hacen más bonito cualquier día. 💚","Esta misión es pequeña, pero está hecha con mucho cariño.","Creo que ya estamos cerca del destino…"];
/* ==================== CORE ==================== */
const W=320,H=180,WORLD=800,HZ=42,SP=62;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
function fit(){let s=Math.min(innerWidth/W,innerHeight/H);if(s>=2)s=Math.floor(s);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const py=x=>112+Math.sin(x/60)*14*Math.max(0,Math.min(1,(700-x)/100));
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const zi=x=>x<200?0:x<410?1:x<620?2:3;
const ZC=[['#15302a','#173329'],['#1c3a2b','#1f3f2e'],['#14223a','#16263e'],['#1a3a2d','#1d3f30']];
const ZN=['Sendero del bosque','Jardincito','Zona nocturna','Casita de '+TO];
/* ==================== AUDIO ==================== */
let AC,master,muted=false;
function initAudio(){if(AC){AC.state=='suspended'&&AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);music()}catch(e){}}
function tone(f,d,ty,v,at){if(!AC)return;const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function music(){const sc=[196,220,262,294,330,392,440];let n=0;setInterval(()=>{if(muted)return;n++;tone(sc[Math.random()*sc.length|0],2.2,'sine',.05);if(n%4==0)tone(sc[(n>>2)%3]/2,3.5,'triangle',.05)},650)}
const sfx={pick(){tone(660,.15,'triangle',.2);tone(990,.22,'triangle',.15,.08)},letter(){[523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.09))},
talk(){tone(440+Math.random()*80,.07,'square',.06)},mission(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.16,i*.1))},
deliver(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.5,'sine',.17,i*.13))}};
function toggleSnd(){muted=!muted;master&&(master.gain.value=muted?0:.5)}
/* ==================== LEVEL ==================== */
const LV=(()=>{
const r=rng(11);
const clampY=y=>Math.max(58,Math.min(166,y));
const mk=(k,a)=>a.map((q,i)=>({k,x:q[0],y:clampY(py(q[0])+q[1]),ph:i*1.7}));
const items=[].concat(
 mk('f',[[90,22],[190,-32],[290,28],[365,-30],[560,30]]),
 mk('l',[[135,-40],[300,38],[380,-38]]),
 mk('s',[[45,-38],[175,40],[240,-34],[470,-32],[520,36],[625,-30],[735,40]]));
const npc={x:55,y:py(55)+22};
const obs=[];
function ok(x,y,ty){
 if(x>385&&x<440)return false; if(x>664&&x<776)return false;
 const p=py(x);
 if(ty=='tree'){if(y>p-22&&y<p+40)return false}else if(Math.abs(y-p)<16)return false;
 for(const i of items){if(Math.hypot(i.x-x,i.y-y)<18)return false;if(ty=='tree'&&Math.abs(i.x-x)<16&&i.y<y&&i.y>y-38)return false}
 if(Math.hypot(npc.x-x,npc.y-y)<20)return false;
 for(const o of obs)if(Math.hypot(o.x-x,o.y-y)<14)return false;
 return true}
function add(ty,x,y){if(ok(x,y,ty)){const R={tree:[-3,-3,6,3],bush:[-6,-5,12,5],rock:[-4,-4,8,4],log:[-6,-4,12,4]}[ty];obs.push({t:ty,x,y,r:{x:x+R[0],y:y+R[1],w:R[2],h:R[3]}})}}
for(let x=8;x<WORLD;x+=16+r()*12)add('tree',x,58+r()*8);
for(let x=10;x<WORLD;x+=15+r()*14){r()<.6?add('tree',x,168+r()*6):add('bush',x,170+r()*4)}
for(let n=0;n<70;n++){const x=20+r()*760,y=72+r()*90,q=r();add(q<.4?'tree':q<.65?'rock':q<.85?'bush':'log',x,y)}
const tufts=[],deco=[];
for(let n=0;n<190;n++){const x=r()*WORLD,y=HZ+4+r()*130;if(Math.abs(y-py(x))>10)tufts.push({x:x|0,y:y|0,c:r()<.5?'#245a3a':'#2c6b45'})}
for(let n=0;n<90;n++){const x=r()*WORLD,y=HZ+8+r()*126;if(Math.abs(y-py(x))>11&&!(x>400&&x<420))deco.push({x:x|0,y:y|0,c:['#ff8fb8','#ffe27a','#bfe8ff','#f4f0ff'][r()*4|0]})}
const lamps=[60,230,350,470,560,660].map(x=>({x,y:py(x)-13}));
const ff=[];for(let n=0;n<24;n++)ff.push({x:r()*WORLD,y:56+r()*110,ph:r()*9});
const sk=[];for(let n=0;n<46;n++)sk.push({x:r()*640,y:r()*34,ph:r()*9});
const SOL=[{x:406,y:44,w:10,h:54},{x:406,y:142,w:10,h:40},{x:690,y:84,w:64,h:26}].concat(obs.map(o=>o.r));
return{items,npc,obs,tufts,deco,lamps,ff,sk,SOL}})();
const GATE={x:406,y:98,w:10,h:44};
/* ==================== STATE ==================== */
const G={},FADE={a:0,d:0,busy:0,cb:null},keys={};
function reset(){Object.assign(G,{state:'title',tt:0,et:0,t:0,p:{x:24,y:py(24),d:'r',t:0,m:0,hop:0,dust:0},c:{f:0,l:0,s:0},gate:0,gateP:0,warn:0,lit:0,starsDone:0,bq:0,npcTalked:0,
 items:LV.items.map(i=>({...i,taken:0})),parts:[],fl:[],dlg:null,menu:null,sel:0,cam:0,zone:-1,banner:{t:0,s:''},flash:0,dv:null,near:null,padState:''})}
function newGame(){reset();G.state='play';G.zone=-1}
function setMenu(m){G.menu=m;G.sel=0}
function trans(cb){if(FADE.busy)return;FADE.busy=1;FADE.d=1;FADE.cb=cb}
reset();
/* ==================== INPUT ==================== */
const map={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{initAudio();const d=map[e.code];
 if(d){keys[d]=1;e.preventDefault();if(G.menu&&!e.repeat)G.sel=(G.sel+((d=='u'||d=='l')?-1:1)+G.menu.length)%G.menu.length}
 else if(['KeyE','Space','Enter'].includes(e.code)){e.preventDefault();if(!e.repeat)act()}
 else if(e.code=='Escape'||e.code=='KeyP')pauseT()});
addEventListener('keyup',e=>{const d=map[e.code];if(d)keys[d]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
function act(){if(FADE.busy)return;const s=G.state;if(s=='play')interact();else if(s=='dlg')adv();else if(G.menu)G.menu[G.sel].fn()}
const PAUSEB=[303,4,13,13],SNDB=[287,4,13,13];
const hit=(q,r)=>q[0]>=r[0]&&q[0]<=r[0]+r[2]&&q[1]>=r[1]&&q[1]<=r[1]+r[3];
cv.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();const b=cv.getBoundingClientRect(),q=[(e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H];
 if(FADE.busy)return;
 if(G.state=='play'){if(hit(q,PAUSEB))return pauseT();if(hit(q,SNDB))return toggleSnd()}
 if(G.state=='dlg')return adv();
 if(G.menu)G.menu.forEach((m,i)=>{if(m.r&&hit(q,m.r)){G.sel=i;m.fn()}})});
const pad=document.getElementById('pad'),dp=document.getElementById('dp'),ab=document.getElementById('ab');
function dpv(e){const b=dp.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;keys.l=x<-14;keys.r=x>14;keys.u=y<-14;keys.d=y>14}
dp.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();dp.setPointerCapture(e.pointerId);dpv(e)});
dp.addEventListener('pointermove',e=>{if(e.buttons)dpv(e)});
['pointerup','pointercancel'].forEach(n=>dp.addEventListener(n,()=>{keys.l=keys.r=keys.u=keys.d=0}));
ab.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();act()});
/* ==================== GAMEPLAY ==================== */
function blocked(x,y){const f={x:x-4,y:y-3,w:8,h:3};
 const o=r=>f.x<r.x+r.w&&f.x+f.w>r.x&&f.y<r.y+r.h&&f.y+f.h>r.y;
 return LV.SOL.some(o)||(!G.gate&&o(GATE))}
function mv(p,ax,ay){const nx=Math.max(6,Math.min(WORLD-6,p.x+ax)),ny=Math.max(52,Math.min(174,p.y+ay));if(!blocked(nx,ny)){p.x=nx;p.y=ny}}
function burst(x,y,cols,n,sp){sp=sp||40;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:.6+Math.random()*.6,c:cols[i%cols.length],g:60})}}
function say(lines,end){G.state='dlg';G.dlg={lines,i:0,sh:0,end,wr:null};prep()}
function prep(){const d=G.dlg,l=d.lines[d.i];ctx.font='bold 8px "Courier New",monospace';d.wr=wrap(l.t,W-36);d.len=d.wr.join('').length;d.sh=0}
function wrap(s,mw){const out=[];let cur='';s.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>mw&&cur){out.push(cur);cur=w}else cur=t});out.push(cur);return out}
function adv(){const d=G.dlg;if(d.sh<d.len){d.sh=d.len;return}sfx.talk();d.i++;if(d.i>=d.lines.length){G.state='play';const e=d.end;G.dlg=null;e&&e()}else prep()}
function openGate(){G.gate=1;sfx.mission();burst(411,118,['#ffe27a','#7cffb0','#ff8fb8'],40,60)}
function pick(i){i.taken=1;const k=i.k,c=G.c;c[k]++;G.p.hop=.3;
 burst(i.x,i.y-6,{f:['#ff8fb8','#fff'],l:['#f3e6d2','#e8557f'],s:['#ffe27a','#fff']}[k],16);
 G.fl.push({x:i.x,y:i.y-14,t:1,s:'+1',c:{f:'#ff8fb8',l:'#f3e6d2',s:'#ffe27a'}[k]});
 if(k=='l'){sfx.letter();const L=[{w:'Carta',t:'Encontraste una cartita…'},{w:'Carta',t:LETTERS[c.l-1]}];
  if(c.l==3)L.push({w:'Misión',t:'Encontraste las tres cartas. El camino está abierto. 💌'});
  say(L,c.l==3?openGate:null)}
 else{sfx.pick();
  if(k=='f'&&c.f==5){G.bq=1;setTimeout(sfx.mission,200);say([{w:'Flores',t:'¡Un pequeño ramo para '+TO+'! 🌷'}])}
  if(k=='s'&&c.s==7){G.starsDone=1;G.lit=6;setTimeout(sfx.mission,200);say([{w:'Estrellas',t:'¡Encontraste todas las estrellas! ✨'},{w:'Estrellas',t:'Ahora el camino está iluminado.'}])}}}
function interact(){const n=G.near;
 if(n=='npc'){sfx.talk();G.npcTalked=1;say([{w:'Conejito',t:'¿Buscas la casa de '+TO+'?'},{w:'Gatito',t:'🐈‍⬛ Miau…'},{w:'Conejito',t:'Entonces sigue las flores. Te están esperando. 🌷'}])}
 else if(n=='gate'){sfx.talk();say([{w:'Cartel',t:'El camino está cerrado…'},{w:'Cartel',t:'Busca las cartas escondidas ('+G.c.l+'/3).'}])}
 else if(n=='pad'){G.state='deliver';G.dv={t:0};sfx.talk()}}
function updPlay(dt){const p=G.p;let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);
 p.m=dx||dy?1:0;
 if(p.m){if(dx&&dy){dx*=.707;dy*=.707}p.d=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');mv(p,dx*SP*dt,0);mv(p,0,dy*SP*dt);
  if((p.dust-=dt)<0){p.dust=.2;G.parts.push({x:p.x,y:p.y,vx:0,vy:-6,l:.35,c:'#8a7a90',g:0})}}
 p.t+=dt;if(p.hop>0)p.hop-=dt;
 G.cam+=(Math.max(0,Math.min(WORLD-W,p.x-W/2))-G.cam)*Math.min(1,dt*6);
 for(const i of G.items){if(!i.taken&&Math.hypot(i.x-p.x,i.y-6-p.y)<11){pick(i);break}}
 const z=zi(p.x);if(z!=G.zone){G.zone=z;G.banner={t:3,s:ZN[z]}}
 const d=(o,x,y)=>Math.hypot(x-p.x,y-p.y);
 G.near=d(0,LV.npc.x,LV.npc.y)<24?'npc':(!G.gate&&d(0,411,120)<28)?'gate':(d(0,722,128)<22?'pad':null);
 const gd=d(0,411,120);if(!G.gate&&gd<30&&!G.warn){G.warn=1;say([{w:'Cartel',t:'El camino está cerrado…'},{w:'Cartel',t:'Para continuar hay que encontrar 3 cartas escondidas.'}])}if(gd>60)G.warn=0;
 if(G.gate&&G.gateP<1)G.gateP=Math.min(1,G.gateP+dt*.8);
 if(G.lit>0)G.lit-=dt;if(G.banner.t>0)G.banner.t-=dt}
function updDeliver(dt){const v=G.dv,p=G.p;v.t+=dt;p.t+=dt;
 if(v.t<1.2){p.x+=(722-p.x)*Math.min(1,dt*4);p.y+=(132-p.y)*Math.min(1,dt*4);p.d='u';p.m=1}else p.m=0;
 if(v.t>1.2&&!v.a){v.a=1;sfx.deliver()}
 if(v.t>2&&!v.b){v.b=1;G.flash=1;burst(722,96,['#ff8fb8','#ffe27a','#fff','#7cffb0'],60,70)}
 if(v.t>2&&v.t<8&&Math.random()<dt*14)burst(722+(Math.random()-.5)*50,90+Math.random()*30,['#ffe27a','#fff','#ff8fb8'],3,25);
 G.cam+=(Math.max(0,Math.min(WORLD-W,p.x-W/2))-G.cam)*Math.min(1,dt*6);
 if(v.t>9.5&&!v.c){v.c=1;trans(()=>{G.state='end';G.et=0;endMenu()})}}
function endMenu(){setMenu([{l:'JUGAR DE NUEVO',fn:()=>trans(newGame)},{l:'VER MI REGALO 💌',fn:()=>trans(()=>{G.state='card';setMenu([{l:'VOLVER',fn:()=>trans(()=>{G.state='end';endMenu()})}])})}])}
function resume(){G.state='play';G.menu=null}
function pauseT(){if(FADE.busy)return;if(G.state=='play'){G.state='pause';setMenu([{l:'CONTINUAR',fn:resume},{l:'REINICIAR',fn:()=>trans(newGame)},{l:()=>'SONIDO: '+(muted?'OFF':'ON'),fn:toggleSnd}])}else if(G.state=='pause')resume()}
function update(dt){G.t+=dt;
 if(FADE.d){FADE.a+=FADE.d*dt*3.5;if(FADE.d>0&&FADE.a>=1){FADE.a=1;FADE.cb&&FADE.cb();FADE.d=-1}else if(FADE.d<0&&FADE.a<=0){FADE.a=0;FADE.d=0;FADE.busy=0}}
 const s=G.state;
 if(s=='title'){G.tt+=dt;if(G.tt>2.8&&!G.menu)setMenu([{l:'COMENZAR MISIÓN',fn:()=>trans(()=>{G.state='play';G.menu=null;G.zone=-1})}])}
 else if(s=='play')updPlay(dt);
 else if(s=='dlg'){const d=G.dlg;if(d.sh<d.len){const o=d.sh|0;d.sh=Math.min(d.len,d.sh+dt*45);if((d.sh|0)!=o&&(d.sh|0)%3==0)sfx.talk()}}
 else if(s=='deliver')updDeliver(dt);
 else if(s=='end')G.et+=dt;
 G.parts.forEach(q=>{q.l-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt});G.parts=G.parts.filter(q=>q.l>0);
 G.fl.forEach(f=>{f.t-=dt;f.y-=14*dt});G.fl=G.fl.filter(f=>f.t>0);
 if(G.flash>0)G.flash-=dt*.8;
 const sh=touch&&(s=='play'||s=='dlg');const ps=sh?'block':'none';if(ps!=G.padState){G.padState=ps;pad.style.display=ps}}
/* ==================== DRAW HELPERS ==================== */
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function txt(s,x,y,c,sz,al){sz=sz||8;ctx.font='bold '+sz+'px "Courier New",monospace';ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.fillStyle='#05060f';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c||'#e8f0e0';ctx.fillText(s,x,y)}
function box(x,y,w,h,b){b=b||'#7cffb0';R(x-2,y+1,w+4,h-2,'#05060f');R(x+1,y-2,w-2,h+4,'#05060f');R(x-1,y,w+2,h,b);R(x,y-1,w,h+2,b);R(x+1,y+1,w-2,h-2,'#0d1128');R(x+2,y+2,w-4,1,'#232c5a')}
function glow(x,y,r,c,a){ctx.fillStyle=c;for(let i=3;i>0;i--){ctx.globalAlpha=a/3;ctx.beginPath();ctx.arc(x,y,r*i/3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function disc(cx,cy,r,c){ctx.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));ctx.fillRect(cx-w,cy+y,w*2,1)}}
const STAR=['...X...','..XXX..','XXXXXXX','.XXXXX.','..XXX..','.XX.XX.','.X...X.'];
function star(x,y,c){ctx.fillStyle=c;STAR.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]=='X')ctx.fillRect(x+i,y+j,1,1)})}
function icon(k,x,y){if(k=='f'){R(x+1,y,3,5,'#ff8fb8');R(x,y+1,5,3,'#ff8fb8');R(x+2,y+2,1,1,'#ffe27a')}else if(k=='l'){R(x,y,7,5,'#f3e6d2');R(x+1,y+1,1,1,'#b9a58a');R(x+2,y+2,1,1,'#b9a58a');R(x+3,y+3,1,1,'#e8557f');R(x+4,y+2,1,1,'#b9a58a');R(x+5,y+1,1,1,'#b9a58a')}else star(x,y-1,'#ffe27a')}
/* ---- sprites ---- */
function cat(x,y,d,mv,t,o){o=o||{};const f=mv?(t*10|0)%2:0,bob=f?-1:0,bl=(t%3.6)<.13,w=Math.round(Math.sin(t*4)*1.6);
 const K='#14141e',L='#2e2e46',E='#7cffb0',P='#e88fb4',Y='#ffe27a';
 ctx.globalAlpha=.4;R(x-6,y-1,12,3,'#000');ctx.globalAlpha=1;y-=(o.hop||0);
 const r=(a,b,c,e,col)=>R(x+a,y+b,c,e,col);
 const pk=(a,b)=>{r(a,b,5,5,P);r(a+2,b,1,5,Y);r(a,b+2,5,1,Y);if(o.bq){r(a,b-2,1,2,'#ff8fb8');r(a+2,b-3,1,2,Y);r(a+4,b-2,1,2,'#fff')}};
